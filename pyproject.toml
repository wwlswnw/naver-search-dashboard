[project]
name = "naver-search-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "networkx>=3.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.1",
    "pyvis>=0.3.2",
    "requests>=2.32.5",
    "streamlit>=1.50.0",
    "urllib3<2",
]

[project.scripts]
naver-search-dashboard = "naver_search_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
